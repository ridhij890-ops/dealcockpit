name: Deploy DealCockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site | Out-Null
          $siteFiles = @(
            "index.html",
            "features.html",
            "engines.html",
            "about.html",
            "app.js",
            "styles.css"
          )
          foreach ($file in $siteFiles) {
            Copy-Item -LiteralPath $file -Destination "_site/$file"
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
