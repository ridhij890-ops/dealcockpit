name: Deploy DealCockpit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Validate static pages and relative assets
        shell: pwsh
        run: |
          $requiredFiles = @(
            "index.html",
            "features.html",
            "engines.html",
            "about.html",
            "app.js",
            "xlsx.full.min.js",
            "LICENSE-SheetJS.txt",
            "styles.css"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required deployment asset is missing: $file"
            }
          }
          foreach ($page in @("index.html", "features.html", "engines.html", "about.html")) {
            $contents = Get-Content -LiteralPath $page -Raw
            if ($contents -notmatch 'href="styles\.css"' -or $contents -notmatch 'src="app\.js"') {
              throw "$page must reference its local stylesheet and application script."
            }
            if ($contents -match '(?:href|src)="\/(?!\/)') {
              throw "$page contains a root-relative static path that would break under the /dealcockpit/ Pages base path."
            }
          }
          $engines = Get-Content -LiteralPath "engines.html" -Raw
          foreach ($feature in @("run-analysis", "sensitivity-growth", "print-ic-memo", "data-preset")) {
            if ($engines -notmatch [regex]::Escape($feature)) {
              throw "Core Engines page is missing required workflow UI: $feature"
            }
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site | Out-Null
          $siteFiles = @(
            "index.html",
            "features.html",
            "engines.html",
            "about.html",
            "app.js",
            "xlsx.full.min.js",
            "LICENSE-SheetJS.txt",
            "styles.css"
          )
          foreach ($file in $siteFiles) {
            Copy-Item -LiteralPath $file -Destination "_site/$file"
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
